<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#1e1f22">
<title>Morse para Morsas</title>
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
<link rel="icon" type="image/png" sizes="64x64" href="/favicon-64.png">
<link rel="apple-touch-icon" href="/icon-192.png">
<style>
  :root {
    color-scheme: dark;
    --bg0:#1e1f22; --bg1:#2b2d31; --bg2:#313338; --bg3:#383a40; --bg4:#404249;
    --text:#dbdee1; --strong:#f2f3f5; --muted:#949ba4;
    --blurple:#5865f2; --blurple-h:#4752c4;
    --green:#23a55a; --green-h:#1a8a49; --red:#f23f42; --red-h:#d83639; --yellow:#f0b232;
    --line:rgba(255,255,255,.07); --focus:#00a8fc;
    --font:"gg sans","Noto Sans","Segoe UI",system-ui,-apple-system,Roboto,"Helvetica Neue",Arial,sans-serif;
  }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  [hidden] { display:none !important; }
  html, body { height:100%; margin:0; }
  body { background:var(--bg2); color:var(--text); font-family:var(--font); font-size:15px; line-height:1.4;
         display:grid; grid-template-rows:auto 1fr auto; height:100dvh; overflow:hidden;
         user-select:none; -webkit-touch-callout:none; }
  button { font:inherit; color:inherit; cursor:pointer; }
  :focus-visible { outline:2px solid var(--focus); outline-offset:2px; }
  svg.ic { width:20px; height:20px; fill:currentColor; flex-shrink:0; }

  /* ---------- Barra superior ---------- */
  .appbar { display:flex; align-items:center; justify-content:space-between; gap:12px;
            padding:max(10px, env(safe-area-inset-top)) 16px 10px; background:var(--bg2);
            box-shadow:0 1px 0 var(--line), 0 1px 2px rgba(0,0,0,.2); position:relative; z-index:2; }
  .brand { display:flex; align-items:center; gap:10px; font-weight:700; font-size:18px; color:var(--strong); letter-spacing:-.01em; }
  .brand img { width:36px; height:36px; display:block; border-radius:10px; }
  .brand { min-width:0; } .brand .bname { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  @media (max-width:420px) { .brand { font-size:16px; } .brand .bname { max-width:32vw; white-space:normal; line-height:1.1; } }
  .chip { display:flex; align-items:center; gap:8px; background:var(--bg1); border:0; border-radius:20px;
          padding:4px 12px 4px 4px; max-width:50vw; color:var(--strong); font-weight:600; font-size:14px; }
  .chip:hover { background:var(--bg0); }
  .chip span.t { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }

  /* ---------- Avatares ---------- */
  .av { --s:40px; width:var(--s); height:var(--s); border-radius:50%; display:inline-flex; align-items:center;
        justify-content:center; color:#fff; font-weight:700; font-size:calc(var(--s) * .42); position:relative;
        flex-shrink:0; text-transform:uppercase; }
  .av .st { position:absolute; right:-2px; bottom:-2px; width:calc(var(--s) * .36); height:calc(var(--s) * .36);
            min-width:10px; min-height:10px; border-radius:50%; background:#80848e; border:3px solid var(--ring, var(--bg1)); }
  .av .st.on { background:var(--green); }
  .stack { display:flex; }
  .stack .av { margin-left:-8px; border:2px solid var(--bg1); }
  .stack .av:first-child { margin-left:0; }

  /* ---------- Escena principal ---------- */
  .stage { display:flex; flex-direction:column; align-items:center; justify-content:space-between;
           padding:18px 16px 8px; min-height:0; overflow:hidden; }
  .pill { display:inline-flex; align-items:center; gap:8px; background:var(--bg1); border:1px solid var(--line);
          border-radius:20px; padding:6px 14px 6px 12px; font-size:13px; color:var(--text); max-width:100%; }
  .pill .pd { width:8px; height:8px; border-radius:50%; background:var(--muted); flex-shrink:0; }
  .pill.ok .pd { background:var(--green); }
  .pill.warn .pd { background:var(--yellow); }
  .pill span.t { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .lampwrap { text-align:center; margin-top:14px; }
  .lamp { width:104px; height:104px; border-radius:50%; margin:0 auto;
          background:radial-gradient(circle at 35% 30%, #5b2c2f, #2a1517 72%);
          box-shadow:inset 0 0 0 4px var(--bg0), 0 0 0 4px #3d4047; transition:background .04s, box-shadow .04s; }
  .lamp.on { background:radial-gradient(circle at 35% 30%, #ff9a9c, var(--red) 55%, #c1272a);
             box-shadow:inset 0 0 0 4px #7a1517, 0 0 0 4px #ff7c7f, 0 0 54px 18px rgba(242,63,66,.6); }
  .lamplabel { margin-top:16px; font-size:12px; font-weight:700; text-transform:uppercase; letter-spacing:.08em; color:var(--muted); }
  .lamp.on + .lamplabel { color:#ff9a9c; }
  .btnwrap { text-align:center; padding-bottom:6px; }
  .press { width:176px; height:176px; border-radius:50%; border:0; touch-action:none; display:flex;
           align-items:center; justify-content:center; margin:0 auto;
           background:radial-gradient(circle at 30% 24%, #7d87f6, var(--blurple) 58%);
           box-shadow:0 10px 0 #3a43a3, 0 20px 32px rgba(0,0,0,.45), inset 0 2px 0 rgba(255,255,255,.18);
           transition:transform .05s, box-shadow .05s; }
  .press.down { transform:translateY(8px); background:radial-gradient(circle at 30% 24%, #6670e8, var(--blurple-h) 58%);
                box-shadow:0 2px 0 #3a43a3, 0 6px 14px rgba(0,0,0,.45), inset 0 2px 0 rgba(255,255,255,.12); }
  .press svg { width:84px; height:84px; fill:none; stroke:#fff; stroke-width:1.7; stroke-linecap:round; stroke-linejoin:round; }
  .hint { margin:26px 0 0; font-size:13px; color:var(--muted); }

  /* ---------- Quiénes están en la conexión / sala (a la izquierda) ---------- */
  .stage { position:relative; }
  .rail { position:absolute; left:8px; top:64px; bottom:8px; width:76px; z-index:1; overflow-y:auto; overflow-x:hidden;
          display:flex; flex-direction:column; align-items:center; gap:12px; padding:6px 0; scrollbar-width:none; }
  .rail::-webkit-scrollbar { display:none; }
  .rail h5 { display:none; margin:0 0 2px; font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:.06em; color:var(--muted); }
  .rm { display:flex; flex-direction:column; align-items:center; gap:5px; width:100%; min-width:0; }
  .rm .nm { font-size:11px; font-weight:600; color:var(--muted); max-width:72px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .rm.off .av { opacity:.45; }
  .rm.talk .nm { color:var(--green); }
  .avw { position:relative; width:52px; height:52px; display:flex; align-items:center; justify-content:center; flex-shrink:0; }
  .ring { position:absolute; inset:0; width:100%; height:100%; transform:rotate(-90deg); pointer-events:none; }
  .ring circle { fill:none; stroke:var(--green); stroke-width:3; stroke-linecap:round; stroke-dasharray:151; stroke-dashoffset:0; }
  /* Mientras habla: círculo verde completo. Al soltar: se va consumiendo durante la espera de 500 ms. */
  .ring.drain circle { animation:drain var(--ms, 500ms) linear forwards; animation-delay:var(--delay, 0ms); }
  @keyframes drain { to { stroke-dashoffset:151; } }

  /* ---------- Barra inferior ---------- */
  .dock { background:var(--bg1); border-top:1px solid var(--line); display:flex; justify-content:center;
          padding:10px 16px calc(10px + env(safe-area-inset-bottom)); }
  .dockbtn { display:flex; align-items:center; justify-content:center; gap:10px; width:100%; max-width:420px;
             min-height:48px; background:var(--bg3); color:var(--strong); border:0; border-radius:24px;
             font-weight:600; font-size:16px; transition:background .12s; }
  .dockbtn:hover { background:var(--bg4); }
  .badge { background:var(--red); color:#fff; border-radius:9px; min-width:18px; height:18px; padding:0 5px; font-size:11px;
           font-weight:700; line-height:18px; text-align:center; display:inline-block; }

  /* ---------- Panel de conexión ---------- */
  .sheet { position:fixed; inset:0; z-index:20; display:flex; justify-content:center; background:rgba(0,0,0,.65);
           animation:fade .15s ease-out; }
  .card { width:100%; height:100%; background:var(--bg2); display:flex; flex-direction:column; animation:up .22s cubic-bezier(.2,.8,.2,1); }
  .shead { display:flex; align-items:center; gap:8px; padding:max(8px, env(safe-area-inset-top)) 8px 8px;
           box-shadow:0 1px 0 var(--line); }
  .shead h2 { margin:0; font-size:17px; font-weight:700; color:var(--strong); flex:1; }
  .iconbtn { width:40px; height:40px; border-radius:50%; border:0; background:none; color:var(--muted);
             display:flex; align-items:center; justify-content:center; }
  .iconbtn:hover { background:var(--bg3); color:var(--strong); }
  .profile { display:flex; align-items:center; gap:14px; padding:16px; background:var(--bg1); margin:12px 16px 4px; border-radius:12px; }
  .profile .pt { flex:1; min-width:0; }
  .profile .pn { font-weight:700; font-size:17px; color:var(--strong); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .profile .ps { font-size:13px; color:var(--muted); }
  .tabs { display:flex; margin:8px 16px 0; border-bottom:1px solid var(--line); gap:4px; }
  .tab { flex:1; background:none; border:0; padding:12px 4px; color:var(--muted); font-weight:600; font-size:14px;
         border-bottom:3px solid transparent; margin-bottom:-1px; display:flex; align-items:center; justify-content:center; gap:6px; }
  .tab:hover { color:var(--text); }
  .tab[aria-selected="true"] { color:var(--strong); border-bottom-color:var(--blurple); }
  .pbody { flex:1; overflow-y:auto; padding:4px 16px 28px; overscroll-behavior:contain; }
  .sec { margin:20px 0 8px; font-size:12px; font-weight:700; text-transform:uppercase; letter-spacing:.04em; color:var(--muted); }

  .item { display:flex; align-items:center; gap:12px; padding:10px 12px; border-radius:10px; background:var(--bg1); margin-bottom:8px; }
  .item .tx { flex:1; min-width:0; }
  .item .nm { font-weight:600; color:var(--strong); overflow-wrap:anywhere; }
  .item .sb { font-size:13px; color:var(--muted); }
  .item.col { flex-direction:column; align-items:stretch; gap:12px; }
  .item .top { display:flex; align-items:center; gap:12px; }
  .actions { display:flex; gap:8px; }
  .actions .btn { flex:1; }

  .btn { display:inline-flex; align-items:center; justify-content:center; gap:6px; min-height:36px; padding:0 14px;
         border:0; border-radius:8px; font-weight:600; font-size:14px; background:var(--bg4); color:var(--strong);
         transition:background .12s; white-space:nowrap; }
  .btn:hover:not(:disabled) { background:#4a4d55; }
  .btn.pri { background:var(--blurple); color:#fff; } .btn.pri:hover:not(:disabled) { background:var(--blurple-h); }
  .btn.ok  { background:var(--green); color:#fff; }   .btn.ok:hover:not(:disabled)  { background:var(--green-h); }
  .btn.bad { background:var(--red); color:#fff; }     .btn.bad:hover:not(:disabled) { background:var(--red-h); }
  .btn.ghost { background:none; color:var(--muted); } .btn.ghost:hover:not(:disabled) { color:var(--strong); background:var(--bg3); }
  .btn.lg { min-height:44px; width:100%; font-size:15px; }
  .btn:disabled { opacity:.5; cursor:not-allowed; }
  .spin { width:14px; height:14px; border-radius:50%; border:2px solid rgba(255,255,255,.35); border-top-color:#fff; animation:rot .8s linear infinite; }

  .empty { text-align:center; padding:36px 16px; color:var(--muted); }
  .empty .eic { width:64px; height:64px; border-radius:50%; background:var(--bg1); margin:0 auto 14px;
                display:flex; align-items:center; justify-content:center; }
  .empty .eic svg { width:30px; height:30px; }
  .empty b { display:block; color:var(--strong); font-size:16px; margin-bottom:4px; }
  .note { display:flex; gap:10px; background:rgba(240,178,50,.1); border:1px solid rgba(240,178,50,.35); color:#f5d78a;
          border-radius:10px; padding:10px 12px; font-size:13px; margin:14px 0 0; }
  .tile { background:var(--bg1); border-radius:12px; padding:16px; margin-bottom:12px; }
  .tile h4 { margin:0 0 4px; font-size:16px; color:var(--strong); }
  .tile p { margin:0 0 12px; font-size:13px; color:var(--muted); }
  .joinbox { display:flex; gap:8px; }
  .field { flex:1; min-width:0; background:var(--bg0); color:var(--strong); border:1px solid transparent; border-radius:6px;
           padding:10px 12px; font:inherit; font-size:16px; user-select:text; }
  .field:focus { outline:none; border-color:var(--blurple); }
  .mbody .field { width:100%; }
  .codein { letter-spacing:.35em; text-transform:uppercase; font-weight:700; font-family:ui-monospace,Consolas,monospace; text-align:center; }
  .room { display:flex; flex-direction:column; gap:12px; }
  .room .rh { display:flex; align-items:center; gap:12px; }
  .room .ric { width:44px; height:44px; border-radius:12px; background:var(--blurple); display:flex; align-items:center; justify-content:center; color:#fff; }
  .room .code { font-family:ui-monospace,Consolas,monospace; font-size:22px; font-weight:700; letter-spacing:.2em; color:var(--strong); }
  .room .mem { display:flex; align-items:center; gap:10px; font-size:13px; color:var(--muted); }

  /* ---------- Ventana de nombre ---------- */
  .modal { position:fixed; inset:0; z-index:40; display:flex; align-items:center; justify-content:center; padding:20px;
           background:rgba(0,0,0,.7); animation:fade .15s ease-out; }
  .mbox { width:100%; max-width:380px; background:var(--bg2); border-radius:14px; overflow:hidden; box-shadow:0 12px 40px rgba(0,0,0,.5); }
  .mbody { padding:22px 20px 14px; text-align:center; }
  .mbody h3 { margin:0 0 6px; font-size:20px; color:var(--strong); }
  .mbody p { margin:0 0 18px; font-size:14px; color:var(--muted); }
  .mbody label { display:block; text-align:left; font-size:12px; font-weight:700; text-transform:uppercase;
                 letter-spacing:.04em; color:var(--muted); margin-bottom:8px; }
  .mfoot { display:flex; justify-content:flex-end; gap:8px; padding:14px 16px; background:var(--bg1); }

  /* ---------- Avisos ---------- */
  .toast { position:fixed; left:50%; bottom:calc(84px + env(safe-area-inset-bottom)); transform:translateX(-50%); z-index:50;
           background:var(--bg0); color:var(--strong); padding:12px 16px 12px 14px; border-radius:8px; font-size:14px; font-weight:500;
           max-width:calc(100% - 32px); box-shadow:0 8px 24px rgba(0,0,0,.45); border-left:4px solid var(--blurple);
           animation:pop .2s ease-out; }
  .toast.ok { border-left-color:var(--green); } .toast.bad { border-left-color:var(--red); } .toast.warn { border-left-color:var(--yellow); }

  @keyframes fade { from { opacity:0; } }
  @keyframes up { from { transform:translateY(24px); opacity:0; } }
  @keyframes pop { from { transform:translate(-50%, 8px); opacity:0; } }
  @keyframes rot { to { transform:rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) { * { animation:none !important; transition:none !important; } }

  @media (min-width:720px) {
    .sheet { align-items:center; }
    .card { height:min(700px, 88vh); max-width:500px; border-radius:16px; box-shadow:0 16px 48px rgba(0,0,0,.55); overflow:hidden; }
    .stage { justify-content:center; gap:48px; }
    .toast { bottom:100px; }
    .rail { width:200px; left:20px; top:24px; align-items:stretch; gap:6px; }
    .rail h5 { display:block; }
    .rm { flex-direction:row; gap:10px; padding:4px 8px; border-radius:10px; }
    .rm .nm { font-size:14px; max-width:none; color:var(--text); }
    .rm.talk { background:var(--bg1); }
  }
  @media (max-height:640px) {
    .lamp { width:76px; height:76px; } .press { width:140px; height:140px; } .press svg { width:64px; height:64px; }
    .hint { margin-top:16px; } .lamplabel { margin-top:10px; }
  }
</style>
</head>
<body>
  <header class="appbar">
    <div class="brand">
      <img src="/icon-192.png" alt="" width="36" height="36">
      <span class="bname">Morse para Morsas</span>
    </div>
    <button id="meChip" class="chip" aria-label="Tu perfil"><span id="meAv"></span><span id="meName" class="t"></span></button>
  </header>

  <main class="stage">
    <aside id="rail" class="rail" aria-label="Quiénes están en la conexión" hidden></aside>
    <button id="pill" class="pill" style="border:1px solid var(--line)"><span class="pd"></span><span id="statusText" class="t">Conectando…</span></button>
    <div class="lampwrap">
      <div id="lamp" class="lamp" role="img" aria-label="Indicador de señal"></div>
      <div id="lampLabel" class="lamplabel" aria-live="polite">Esperando señal</div>
    </div>
    <div class="btnwrap">
      <button id="btn" class="press" aria-label="Mantener apretado para enviar señal">
        <!-- mano con dedo apuntando (símbolo de "tocar") -->
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 11V5a1.5 1.5 0 0 1 3 0v5.5l4.2.9a2 2 0 0 1 1.6 2.2l-.6 4.3a3 3 0 0 1-3 2.6H11a3 3 0 0 1-2.3-1.1L5.5 14.7a1.5 1.5 0 0 1 2.2-2L9 14"/></svg>
      </button>
      <p class="hint">Mantené apretado para enviar</p>
    </div>
  </main>

  <nav class="dock">
    <button id="open" class="dockbtn" aria-haspopup="dialog"><span id="dockIc"></span>Conexión<span id="badge" class="badge" hidden></span></button>
  </nav>

  <div id="sheet" class="sheet" hidden>
    <section class="card" role="dialog" aria-modal="true" aria-label="Conexión">
      <div class="shead">
        <button id="close" class="iconbtn" aria-label="Volver"></button>
        <h2>Conexión</h2>
      </div>
      <div id="profile" class="profile"></div>
      <div class="tabs" role="tablist">
        <button class="tab" role="tab" data-tab="people">Personas</button>
        <button class="tab" role="tab" data-tab="rooms">Salas</button>
        <button class="tab" role="tab" data-tab="req">Solicitudes<span id="tbadge" class="badge" hidden></span></button>
      </div>
      <div id="pbody" class="pbody" role="tabpanel"></div>
    </section>
  </div>

  <div id="modal" class="modal" hidden>
    <div class="mbox" role="dialog" aria-modal="true" aria-labelledby="mtitle">
      <div class="mbody">
        <h3 id="mtitle">Elegí tu nombre</h3>
        <p>Es lo que van a ver las demás personas.</p>
        <label for="nameIn">Nombre</label>
        <input id="nameIn" class="field" maxlength="20" placeholder="Tu nombre" autocomplete="off">
      </div>
      <div class="mfoot">
        <button id="nameCancel" class="btn ghost">Cancelar</button>
        <button id="nameOk" class="btn pri">Guardar</button>
      </div>
    </div>
  </div>
  <div id="codeModal" class="modal" hidden>
    <div class="mbox" role="dialog" aria-modal="true" aria-labelledby="ctitle">
      <div class="mbody">
        <h3 id="ctitle">Código de acceso</h3>
        <p id="codeMsg">Este servidor está protegido. Pedile el código a quien lo administra; se guarda en este dispositivo.</p>
        <label for="codeIn">Código</label>
        <input id="codeIn" class="field" type="password" maxlength="128" placeholder="Código de acceso" autocomplete="off">
      </div>
      <div class="mfoot">
        <button id="codeOk" class="btn pri">Entrar</button>
      </div>
    </div>
  </div>
  <div id="toast" class="toast" role="status" hidden></div>

<script>
  const $ = id => document.getElementById(id);
  const lamp = $('lamp'), btn = $('btn');
  const store = {
    get: k => { try { return localStorage.getItem(k); } catch { return null; } },
    set: (k, v) => { try { localStorage.setItem(k, v); } catch {} },
  };

  // ---------- Íconos (trazados fijos, nunca construidos con datos de otros dispositivos) ----------
  const ICONS = {
    people: 'M16 11c1.66 0 2.99-1.34 2.99-3S17.66 5 16 5c-1.66 0-3 1.34-3 3s1.34 3 3 3zm-8 0c1.66 0 2.99-1.34 2.99-3S9.66 5 8 5C6.34 5 5 6.34 5 8s1.34 3 3 3zm0 2c-2.33 0-7 1.17-7 3.5V19h14v-2.5c0-2.33-4.67-3.5-7-3.5zm8 0c-.29 0-.62.02-.97.05 1.16.84 1.97 1.97 1.97 3.45V19h6v-2.5c0-2.33-4.67-3.5-7-3.5z',
    check: 'M9 16.17 4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z',
    close: 'M19 6.41 17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z',
    back: 'M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z',
    edit: 'M3 17.25V21h3.75L17.81 9.94l-3.75-3.75L3 17.25zM20.71 7.04a1 1 0 0 0 0-1.41l-2.34-2.34a1 1 0 0 0-1.41 0l-1.83 1.83 3.75 3.75 1.83-1.83z',
    block: 'M12 2C6.47 2 2 6.47 2 12s4.47 10 10 10 10-4.47 10-10S17.53 2 12 2zM4 12c0-4.42 3.58-8 8-8 1.85 0 3.55.63 4.9 1.69L5.69 16.9A7.902 7.902 0 0 1 4 12zm8 8c-1.85 0-3.55-.63-4.9-1.69L18.31 7.1A7.902 7.902 0 0 1 20 12c0 4.42-3.58 8-8 8z',
    plus: 'M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z',
    exit: 'M10.09 15.59 11.5 17l5-5-5-5-1.41 1.41L12.67 11H3v2h9.67l-2.58 2.59zM19 3H5a2 2 0 0 0-2 2v4h2V5h14v14H5v-4H3v4a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V5a2 2 0 0 0-2-2z',
    room: 'M20 9V7h-4V3h-2v4h-4V3H8v4H4v2h4v4H4v2h4v4h2v-4h4v4h2v-4h4v-2h-4V9h4zm-6 4h-4V9h4v4z',
    addUser: 'M15 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm-9-2V7H4v3H1v2h3v3h2v-3h3v-2H6zm9 4c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z',
    bell: 'M12 22c1.1 0 2-.9 2-2h-4c0 1.1.9 2 2 2zm6-6v-5c0-3.07-1.63-5.64-4.5-6.32V4c0-.83-.67-1.5-1.5-1.5s-1.5.67-1.5 1.5v.68C7.64 5.36 6 7.92 6 11v5l-2 2v1h16v-1l-2-2z',
    warn: 'M1 21h22L12 2 1 21zm12-3h-2v-2h2v2zm0-4h-2v-4h2v4z',
  };
  function ic(name) {
    const s = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
    s.setAttribute('viewBox', '0 0 24 24'); s.setAttribute('class', 'ic'); s.setAttribute('aria-hidden', 'true');
    s.innerHTML = '<path d="' + ICONS[name] + '"/>';
    return s;
  }
  $('dockIc').replaceWith(ic('people'));
  $('close').append(ic('back'));

  // ---------- Estado de la señal ----------
  let held = false, others = false, ws, vibTimer = null;

  // Un toque corto llega como "1" y "0" casi juntos: se mantiene lo recibido un mínimo para que se note.
  const MIN_MS = 100;
  let shownAt = 0, offTimer = null;
  function setOthers(v) {
    if (v) {
      clearTimeout(offTimer); offTimer = null;
      if (!others) { others = true; shownAt = Date.now(); }
    } else if (others && !offTimer) {
      offTimer = setTimeout(() => { offTimer = null; others = false; render(); },
                            Math.max(0, MIN_MS - (Date.now() - shownAt)));
    }
    render();
  }

  // En la app nueva (con deviceId) vibra el servicio nativo, así también funciona con la app cerrada.
  const inApp = !!(window.AndroidBridge && AndroidBridge.deviceId);
  // El id es secreto (el servidor nunca se lo muestra a otros), así que se genera largo e impredecible.
  const newDeviceId = () => {
    try { return [...crypto.getRandomValues(new Uint8Array(16))].map(b => b.toString(16).padStart(2, '0')).join(''); }
    catch { return Array.from({ length: 4 }, () => Math.random().toString(36).slice(2, 10)).join(''); }
  };
  const deviceId = inApp ? AndroidBridge.deviceId() : (store.get('dev') || newDeviceId());
  if (!inApp) store.set('dev', deviceId);

  // Código de acceso del servidor (si lo tiene). En la app también lo necesita el servicio, por eso va por el puente.
  let code = store.get('code') || (inApp && AndroidBridge.getCode ? AndroidBridge.getCode() : '') || '';

  // Solo en el navegador (en la app vibra el servicio): vibra mientras aprieta OTRO dispositivo, nunca por
  // el toque propio; un toque corto se mantiene un mínimo para que se sienta.
  let vibOn = false, vibSince = 0, vibStop = null;
  function updateVib() {
    const buzz = ms => navigator.vibrate && navigator.vibrate(ms);
    if (others) {
      clearTimeout(vibStop); vibStop = null;
      if (!vibOn) {
        vibOn = true; vibSince = Date.now();
        buzz(10000);
        vibTimer = setInterval(() => buzz(10000), 9000);
      }
    } else if (vibOn && !vibStop) {
      vibStop = setTimeout(() => {
        vibStop = null; vibOn = false;
        clearInterval(vibTimer); buzz(0);
      }, Math.max(0, MIN_MS - (Date.now() - vibSince)));
    }
  }

  // `blocked`: apretaste pero otra persona tiene la palabra; no se envía nada y la luz no se prende.
  let blocked = false;
  function render() {
    const sending = held && !blocked;
    lamp.classList.toggle('on', sending || others);
    $('lampLabel').textContent = others ? 'Señal recibida' : sending ? 'Enviando señal' : blocked ? 'Esperá tu turno' : 'Esperando señal';
    if (!inApp) updateVib();
  }

  // ---------- Turno de palabra ----------
  // Habla una sola persona a la vez. El servidor decide; acá solo se evita mandar lo que sería rechazado.
  const FLOOR_MS = 500;
  let floor = { d: null, last: null, end: 0 }, floorTimer = null;   // d: quién habla; last: quién habló último
  function setFloor(f) {
    floor = { d: f.d, last: f.last, end: Date.now() + f.left };
    clearTimeout(floorTimer);
    if (!f.d && f.left > 0) floorTimer = setTimeout(renderRail, f.left + 30);   // al terminar la espera, se apaga el anillo
    renderRail();
  }
  const inGroup = () => !!(st && (st.links.length || st.rooms.length));
  function canTalk() {
    if (!inGroup()) return true;
    if (floor.d) return floor.d === st.me.d;
    return floor.last === st.me.d || Date.now() >= floor.end;
  }

  function railMembers() {
    if (!st) return [];
    if (st.rooms[0]) return st.rooms[0].members.map(m => ({ d: m.me ? st.me.d : m.d, n: m.n, online: m.online, me: m.me }));
    if (st.links[0]) return [{ d: st.me.d, n: st.me.n, online: true, me: true },
                             { d: st.links[0].d, n: st.links[0].n, online: st.links[0].online }];
    return [];
  }
  function renderRail() {
    const list = railMembers(), rail = $('rail');
    rail.hidden = !list.length;
    if (!list.length) return rail.replaceChildren();
    const cooling = !floor.d && floor.last && floor.end > Date.now();
    rail.replaceChildren(
      el('h5', {}, st.rooms[0] ? 'Sala ' + st.rooms[0].code : 'Conversación'),
      ...list.map(m => {
        const talking = floor.d === m.d, drain = cooling && floor.last === m.d;
        const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
        svg.setAttribute('viewBox', '0 0 52 52'); svg.setAttribute('aria-hidden', 'true');
        svg.setAttribute('class', 'ring' + (drain ? ' drain' : ''));
        if (drain) {   // empieza donde corresponde si el aviso llegó con retraso
          svg.style.setProperty('--ms', FLOOR_MS + 'ms');
          svg.style.setProperty('--delay', -(FLOOR_MS - Math.max(0, floor.end - Date.now())) + 'ms');
        }
        const c = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
        c.setAttribute('cx', 26); c.setAttribute('cy', 26); c.setAttribute('r', 24);
        svg.append(c);
        return el('div', { class: 'rm' + (talking ? ' talk' : '') + (m.online ? '' : ' off') },
          el('div', { class: 'avw' }, avatar(m.n, 40, m.online, 'var(--bg2)'), talking || drain ? svg : null),
          el('div', { class: 'nm' }, m.me ? m.n + ' (vos)' : m.n));
      }));
  }

  // ---------- Conexión con el servidor ----------
  let st = null;   // último estado enviado por el servidor (personas, conexiones, salas, solicitudes)
  let name = store.get('name') || (inApp && AndroidBridge.getName ? AndroidBridge.getName() : '') || '';

  const tx = o => { if (ws && ws.readyState === 1) ws.send(JSON.stringify(o)); };

  function setPill(kind, text) {
    $('pill').className = 'pill ' + kind;
    $('statusText').textContent = text;
  }

  // Reconexión: 1 s, 2 s, 4 s, 8 s y después cada 10 s (no machacar al servidor ni la batería si está caído).
  let retries = 0, retryTimer = null, needCode = false;
  function connect() {
    clearTimeout(retryTimer); retryTimer = null;
    const sock = ws = new WebSocket((location.protocol === 'https:' ? 'wss://' : 'ws://') + location.host +
                                    '/?d=' + deviceId + (code ? '&k=' + encodeURIComponent(code) : ''));
    sock.onopen = () => {
      retries = 0;
      setPill('ok', 'Conectado');
      if (name) tx({ t: 'name', n: name });
      if (held && !blocked) sock.send('1');
    };
    sock.onmessage = e => {
      const m = e.data;
      if (m[0] !== '{') return setOthers(m === '1');
      let o;
      try { o = JSON.parse(m); } catch { return; }
      if (o.t === 'state') {
        o.sent.forEach(s => { s.end = Date.now() + s.left; });
        st = o; renderStatus(); renderPanel(); setFloor(o.floor);
      } else if (o.t === 'floor') setFloor(o);
      else if (o.t === 'deny') { setFloor(o); blocked = true; render(); }   // otra persona tiene la palabra
      else if (o.t === 'ev') showEvent(o);
    };
    sock.onclose = e => {
      if (sock !== ws) return;   // un socket viejo que ya reemplazamos
      st = null; setOthers(false); renderPanel(); renderRail();
      if (e.code === 4001) {   // el servidor pide un código de acceso (o el que hay es incorrecto): no reintentar a ciegas
        setPill('warn', 'Falta el código de acceso');
        askCode(code ? 'Ese código no es correcto. Probá de nuevo.' : '');
        return;
      }
      setPill('warn', e.code === 4029 ? 'Demasiados intentos, esperá un minuto…' : 'Reconectando…');
      retryTimer = setTimeout(connect, e.code === 4029 ? 60000 : Math.min(10000, 1000 * 2 ** retries++));
    };
  }
  connect();
  // Al volver a la app (p. ej. después de bloquear el celular) no esperar el reintento: reconectar ya.
  document.addEventListener('visibilitychange', () => {
    if (!document.hidden && ws.readyState > 1 && !needCode) { retries = 0; connect(); }
  });

  function askCode(msg) {
    needCode = true;
    $('codeMsg').textContent = msg || 'Este servidor está protegido. Pedile el código a quien lo administra; se guarda en este dispositivo.';
    $('codeIn').value = '';
    $('codeModal').hidden = false;
    $('codeIn').focus();
  }
  function saveCode() {
    const c = $('codeIn').value.trim();
    if (!c) { $('codeIn').focus(); return; }
    code = c; store.set('code', c);
    if (inApp && AndroidBridge.setCode) AndroidBridge.setCode(c);   // el servicio lo usa y se reconecta
    $('codeModal').hidden = true;
    needCode = false; retries = 0;
    connect();
  }
  $('codeOk').onclick = saveCode;
  $('codeIn').addEventListener('keydown', e => { if (e.key === 'Enter') saveCode(); });

  function renderStatus() {
    const link = st.links[0], room = st.rooms[0];
    if (link) setPill('ok', 'Conectado con ' + link.n);
    else if (room) setPill('ok', 'Sala ' + room.code + ' · ' + room.members.length + (room.members.length === 1 ? ' persona' : ' personas'));
    else setPill('idle', 'Sin conexiones · tocá Conexión');
    const k = st.inbox.length;
    for (const b of [$('badge'), $('tbadge')]) { b.hidden = !k; b.textContent = k; }
  }
  $('pill').onclick = () => openSheet('people');

  // ---------- Botón ----------
  function send(down) {
    if (held === down) return;
    held = down;
    btn.classList.toggle('down', down);
    if (down) blocked = !canTalk();                      // si habla otra persona, no se envía nada
    if (ws.readyState === 1 && !blocked) ws.send(down ? '1' : '0');
    if (!down) blocked = false;
    render();
  }
  btn.addEventListener('pointerdown', e => { btn.setPointerCapture(e.pointerId); send(true); });
  ['pointerup', 'pointercancel', 'lostpointercapture'].forEach(t => btn.addEventListener(t, () => send(false)));
  btn.addEventListener('contextmenu', e => e.preventDefault());
  addEventListener('keydown', e => {
    if (e.code === 'Space' && !e.repeat && !/INPUT|BUTTON/.test(document.activeElement.tagName)) { e.preventDefault(); send(true); }
  });
  addEventListener('keyup', e => { if (e.code === 'Space') send(false); });
  // Si la app pierde el foco con el botón apretado, no llega el "soltar": lo soltamos nosotros.
  addEventListener('blur', () => send(false));
  document.addEventListener('visibilitychange', () => { if (document.hidden) send(false); });

  // ---------- Construcción de elementos ----------
  // Los nombres vienen de otros dispositivos: siempre se insertan como texto, nunca como HTML.
  function el(tag, attrs, ...kids) {
    const e = document.createElement(tag);
    for (const [k, v] of Object.entries(attrs || {})) {
      if (k === 'class') e.className = v;
      else if (k.startsWith('on')) e.addEventListener(k.slice(2), v);
      else e.setAttribute(k, v);
    }
    for (const c of kids.flat()) if (c != null) e.append(c);
    return e;
  }
  const AV_COLORS = ['#5865f2', '#747f8d', '#3ba55c', '#faa61a', '#ed4245', '#eb459e'];
  const hash = s => [...s].reduce((h, c) => (h * 31 + c.codePointAt(0)) >>> 0, 7);
  function avatar(n, size = 40, online, ring) {
    const a = el('span', { class: 'av', style: '--s:' + size + 'px;background:' + AV_COLORS[hash(n) % AV_COLORS.length] + (ring ? ';--ring:' + ring : '') },
                 ([...n.trim()][0] || '?'));
    if (online !== undefined) a.append(el('span', { class: 'st' + (online ? ' on' : '') }));
    return a;
  }
  function button(cls, label, icon, onclick) {
    return el('button', { class: 'btn ' + cls, onclick }, icon ? ic(icon) : null, label);
  }
  const secs = end => Math.max(0, Math.ceil((end - Date.now()) / 1000)) + ' s';
  const waiting = s => el('button', { class: 'btn pri', disabled: '' }, el('span', { class: 'spin' }),
                          'Conectando… ', el('span', { 'data-end': s.end }, secs(s.end)));
  const section = (title, count) => el('div', { class: 'sec' }, count == null ? title : title + ' — ' + count);
  const empty = (icon, title, hint) => el('div', { class: 'empty' },
    el('div', { class: 'eic' }, ic(icon)), el('b', {}, title), hint);
  const note = text => el('div', { class: 'note' }, ic('warn'), el('span', {}, text));
  const item = (av, nm, sb, ...right) => el('div', { class: 'item' }, av,
    el('div', { class: 'tx' }, el('div', { class: 'nm' }, nm), sb ? el('div', { class: 'sb' }, sb) : null), ...right);

  // ---------- Perfil y nombre ----------
  function renderMe() {
    $('meAv').replaceChildren(avatar(name || '?', 28));
    $('meName').textContent = name || 'Sin nombre';
    $('profile').replaceChildren(avatar(name || '?', 56, true, 'var(--bg1)'),
      el('div', { class: 'pt' }, el('div', { class: 'pn' }, name || 'Sin nombre'), el('div', { class: 'ps' }, 'En línea')),
      button('', 'Editar', 'edit', askName));
  }
  function askName() {
    $('nameIn').value = name;
    $('nameCancel').hidden = !name;   // la primera vez el nombre es obligatorio
    $('modal').hidden = false;
    $('nameIn').focus();
  }
  function saveName() {
    const n = $('nameIn').value.trim().slice(0, 20);
    if (!n) { $('nameIn').focus(); return; }
    name = n; store.set('name', n);
    if (inApp && AndroidBridge.setName) AndroidBridge.setName(n);
    $('modal').hidden = true;
    tx({ t: 'name', n });
    renderMe();
  }
  $('nameOk').onclick = saveName;
  $('nameCancel').onclick = () => { $('modal').hidden = true; };
  $('nameIn').addEventListener('keydown', e => { if (e.key === 'Enter') saveName(); });
  $('meChip').onclick = askName;
  renderMe();
  if (!name) askName();
  else if (inApp && AndroidBridge.setName) AndroidBridge.setName(name);   // que el servicio lo conozca

  // ---------- Panel de conexión ----------
  let tab = 'people', joinCode = '';

  function peopleView() {
    const out = [];
    if (st.busy) out.push(note('Ya estás conectado. Para conectarte con otra persona, primero desconectate o salí de tu sala.'));
    out.push(section('Conectados ahora', st.online.length));
    if (!st.online.length) out.push(empty('people', 'No hay nadie más conectado', 'Abrí la app en otro dispositivo para verlo acá.'));
    for (const p of st.online) {
      const s = st.sent.find(x => x.kind === 'link' && x.to === p.d);
      out.push(item(avatar(p.n, 40, true), p.n, p.linked ? 'Conectado con vos' : p.busy ? 'Ocupado en otra conexión' : 'En línea',
        p.linked ? el('span', { class: 'sb' }, ic('check'))
        : s ? waiting(s)
        : p.busy ? null
        : st.busy ? el('button', { class: 'btn pri', disabled: '' }, 'Conectar')
        : button('pri', 'Conectar', 'addUser', () => tx({ t: 'link', to: p.d }))));
    }
    out.push(section('Mis conexiones', st.links.length));
    if (!st.links.length) out.push(empty('addUser', 'Todavía no estás conectado con nadie', 'Elegí a alguien de la lista y tocá Conectar.'));
    for (const l of st.links)
      out.push(item(avatar(l.n, 40, l.online), l.n, l.online ? 'En línea' : 'Sin conexión',
        button('bad', 'Desconectar', null, () => tx({ t: 'unlink', d: l.d }))));
    return out;
  }

  function roomsView() {
    const out = [];
    if (st.busy && !st.rooms.length) {
      out.push(note('Ya estás conectado con una persona. Para crear una sala o unirte a otra, primero desconectate.'));
    } else if (st.busy) {
      out.push(note('Ya estás en una sala. Para crear otra o unirte a otra, primero salí de esta.'));
    } else {
      out.push(el('div', { class: 'tile' }, el('h4', {}, 'Crear una sala'),
        el('p', {}, 'Obtenés un código para compartir. Vos decidís quién entra.'),
        button('pri lg', 'Crear sala', 'plus', () => tx({ t: 'create' }))));
      out.push(el('div', { class: 'tile' }, el('h4', {}, 'Unirse a una sala'),
        el('p', {}, 'Escribí el código de 4 letras. El anfitrión tiene que aceptarte.'),
        el('div', { class: 'joinbox' },
          el('input', { id: 'joincode', class: 'field codein', maxlength: '4', placeholder: 'ABCD', autocomplete: 'off',
                        'aria-label': 'Código de sala', oninput: e => { joinCode = e.target.value.toUpperCase(); } }),
          button('pri', 'Unirme', null, () => { if (joinCode.length === 4) tx({ t: 'join', code: joinCode }); }))));
    }
    for (const s of st.sent.filter(x => x.kind === 'join'))
      out.push(item(el('span', { class: 'av', style: '--s:40px;background:var(--blurple)' }, ic('room')),
        'Sala ' + s.code, 'Esperando que te acepten', waiting(s)));
    out.push(section('Mi sala', st.rooms.length));
    if (!st.rooms.length) out.push(empty('room', 'No estás en ninguna sala', 'Creá una o unite con un código.'));
    for (const r of st.rooms)
      out.push(el('div', { class: 'item col' },
        el('div', { class: 'rh' }, el('div', { class: 'ric' }, ic('room')),
          el('div', { class: 'tx' }, el('div', { class: 'code' }, r.code),
            el('div', { class: 'sb' }, r.host ? 'Sos el anfitrión' : 'Anfitrión: ' + r.hostName))),
        el('div', { class: 'mem' }, el('div', { class: 'stack' }, r.members.map(m => avatar(m.n, 32))),
          el('span', {}, r.members.map(m => m.n + (m.me ? ' (vos)' : '')).join(', '))),
        button('bad lg', r.host ? 'Cerrar sala' : 'Salir de la sala', 'exit', () => tx({ t: 'leave', code: r.code }))));
    return out;
  }

  function reqView() {
    if (!st.inbox.length) return [empty('bell', 'No tenés solicitudes', 'Cuando alguien quiera conectarse con vos, va a aparecer acá.')];
    return [section('Pendientes', st.inbox.length), ...st.inbox.map(r => el('div', { class: 'item col' },
      el('div', { class: 'top' }, avatar(r.from, 40),
        el('div', { class: 'tx' }, el('div', { class: 'nm' }, r.from),
          el('div', { class: 'sb' }, r.kind === 'join' ? 'Quiere unirse a tu sala ' + r.code : 'Quiere conectarse con vos'))),
      el('div', { class: 'actions' },
        button('ok', 'Aceptar', 'check', () => tx({ t: 'answer', id: r.id, ok: true })),
        button('bad', 'Rechazar', 'close', () => tx({ t: 'answer', id: r.id, ok: false })),
        button('', 'Ignorar', 'block', () => tx({ t: 'ignore', id: r.id })))))];
  }

  function renderPanel() {
    if ($('sheet').hidden) return;
    document.querySelectorAll('.tab').forEach(t => t.setAttribute('aria-selected', t.dataset.tab === tab));
    const body = $('pbody');
    if (!st) { body.replaceChildren(empty('warn', 'Sin conexión con el servidor', 'Reintentando…')); return; }
    const typing = document.activeElement && document.activeElement.id === 'joincode';
    body.replaceChildren(...{ people: peopleView, rooms: roomsView, req: reqView }[tab]());
    const inp = $('joincode');
    if (inp) { inp.value = joinCode; if (typing) inp.focus(); }
  }

  function openSheet(t) {
    if (t) tab = t;
    $('sheet').hidden = false;
    renderMe(); renderPanel();
  }
  const closeSheet = () => { $('sheet').hidden = true; };
  document.querySelectorAll('.tab').forEach(t => t.onclick = () => { tab = t.dataset.tab; renderPanel(); });
  $('open').onclick = () => openSheet();
  $('close').onclick = closeSheet;
  $('sheet').addEventListener('click', e => { if (e.target === $('sheet')) closeSheet(); });
  addEventListener('keydown', e => {
    if (e.key !== 'Escape') return;
    if (!$('modal').hidden) { if (name) $('modal').hidden = true; } else closeSheet();
  });
  // Cuenta regresiva de las solicitudes enviadas, sin rehacer el panel (así no se pierde lo que se escribe).
  setInterval(() => document.querySelectorAll('[data-end]').forEach(e => { e.textContent = secs(+e.dataset.end); }), 500);

  let toastTimer;
  function toast(msg, kind) {
    const t = $('toast');
    t.textContent = msg; t.className = 'toast ' + (kind || ''); t.hidden = false;
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => { t.hidden = true; }, 4000);
  }
  function showEvent(o) {
    const sala = o.kind === 'join' ? ' (sala ' + o.code + ')' : '';
    const [msg, kind] = {
      accepted: [o.who + ' aceptó tu solicitud' + sala, 'ok'],
      rejected: [o.who + ' rechazó tu solicitud' + sala, 'bad'],
      expired: [o.who + ' no respondió' + sala, 'warn'],
      busy: ['No se pudo conectar con ' + o.who + ': ya está conectado con otro', 'warn'],
      offline: [o.who + ' se desconectó' + sala, 'warn'],
      closed: ['La sala ' + o.code + ' se cerró', 'warn'],
      error: [o.msg, 'bad'],
    }[o.k] || ['', ''];
    if (msg) toast(msg, kind);
  }
</script>
</body>
</html>
